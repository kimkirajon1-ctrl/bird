<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Aşk - Gerçek Zamanlı</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0a1a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui;
            padding: 20px;
        }
        .game-container {
            width: 1300px;
            max-width: 98vw;
            background: #000000aa;
            border-radius: 48px;
            backdrop-filter: blur(4px);
            padding: 20px;
        }
        .split-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .player-area {
            background: rgba(0,0,0,0.6);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid rgba(255,215,0,0.3);
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            color: gold;
            font-weight: bold;
            font-size: 1.5rem;
            border-bottom: 1px solid gold;
        }
        .score-board {
            display: flex;
            gap: 24px;
            font-family: monospace;
            font-size: 1.2rem;
        }
        canvas {
            display: block;
            width: 100%;
            background: #1e3c4a;
            cursor: pointer;
        }
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0f172a, #020617);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }
        .card {
            background: rgba(30,41,59,0.95);
            border-radius: 64px;
            padding: 40px;
            width: 500px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .char-select {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 30px 0;
        }
        .char-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 60px;
            cursor: pointer;
            border: 3px solid transparent;
        }
        .char-card.selected {
            border-color: gold;
            background: #2d3a5e;
        }
        button {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active { transform: scale(0.96);}
        input, select {
            padding: 12px;
            margin: 10px 0;
            border-radius: 60px;
            border: none;
            width: 80%;
            font-size: 1rem;
            text-align: center;
        }
        .prize-area {
            background: #00000055;
            border-radius: 48px;
            padding: 20px;
            margin: 20px 0;
        }
        @media (max-width: 800px) {
            .player-header { font-size: 1rem; }
            .score-board { font-size: 0.8rem; gap: 12px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="game-container" style="display: none;" id="gameUI">
        <div class="split-screen">
            <div class="player-area" id="ceylanArea">
                <div class="player-header">
                    <span>🦢 CEYLAN 💖</span>
                    <div class="score-board">
                        <span>🏆 Skor: <span id="ceylanScore">0</span></span>
                        <span>💀 Ölüm: <span id="ceylanDeaths">0</span></span>
                    </div>
                </div>
                <canvas id="ceylanCanvas" width="800" height="350"></canvas>
            </div>
            <div class="player-area" id="hakkiArea">
                <div class="player-header">
                    <span>🦅 HAKKI 🔥</span>
                    <div class="score-board">
                        <span>🏆 Skor: <span id="hakkiScore">0</span></span>
                        <span>💀 Ölüm: <span id="hakkiDeaths">0</span></span>
                    </div>
                </div>
                <canvas id="hakkiCanvas" width="800" height="350"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Karakter Seçim -->
<div id="charSelectScreen" class="screen">
    <div class="card">
        <h1 style="color:#FFD966">✨ AŞKIN KANATLARI ✨</h1>
        <div class="char-select">
            <div class="char-card" data-char="ceylan">
                <div style="font-size: 80px;">🦢</div>
                <div>Ceylan</div>
            </div>
            <div class="char-card" data-char="hakki">
                <div style="font-size: 80px;">🦅</div>
                <div>Hakkı</div>
            </div>
        </div>
        <button id="confirmCharBtn" disabled>Seçimi Onayla</button>
    </div>
</div>

<!-- Ceylan Ayarları -->
<div id="settingsCeylan" class="screen" style="display: none;">
    <div class="card">
        <h2>🎁 Ceylan Ödül Belirleme 🎁</h2>
        <div class="prize-area">
            <input type="text" id="ceylanPrize" placeholder="Ödül: Sana kahve ısmarlayacaksın ❤️">
            <input type="number" id="ceylanLossLimit" value="5" min="1" max="20" placeholder="Ölüm sınırı">
        </div>
        <button id="ceylanReadyBtn">⚡ Oyuna Hazırım ⚡</button>
    </div>
</div>

<!-- Hakkı Ayarları -->
<div id="settingsHakki" class="screen" style="display: none;">
    <div class="card">
        <h2>🔥 Hakkı Ayarları 🔥</h2>
        <div class="prize-area">
            <input type="text" id="hakkiPrize" placeholder="Ödül: Sarılmak, kahve vs.">
            <select id="gameMode">
                <option value="normal">Normal Mod</option>
                <option value="ask">💖 AŞK MODU 💖</option>
            </select>
            <input type="number" id="hakkiLossLimit" value="5" min="1" max="20" placeholder="Ölüm sınırı">
        </div>
        <button id="hakkiReadyBtn">💘 Oyuna Hazırım 💘</button>
    </div>
</div>

<!-- Bekleme -->
<div id="waitingScreen" class="screen" style="display: none;">
    <div class="card">
        <h2>🌈 Rakipler birleşiyor...</h2>
        <div style="font-size: 40px;">⏳</div>
        <p id="waitStatus">Karşındaki oyuncuyu bekliyorum...</p>
    </div>
</div>

<!-- Oyun Bitti -->
<div id="gameOverModal" class="screen" style="display: none;">
    <div class="card">
        <h1 id="winnerText">🎉 KAZANAN 🎉</h1>
        <p id="prizeText" style="font-size: 1.5rem; margin: 20px;"></p>
        <button onclick="location.reload()">🔄 Yeniden Oyna</button>
    </div>
</div>

<script>
    let socket = io();
    let myCharacter = null;
    let roomId = null;
    let gameActive = false;
    let gameLoopId = null;
    let drawLoopId = null;
    
    // Yerel oyuncu verileri
    let myBird = { y: 160, velocity: 0, alive: true, score: 0, deaths: 0 };
    let opponentBird = { y: 160, velocity: 0, alive: true, score: 0, deaths: 0 };
    let opponentChar = null;
    
    // Borular
    let pipes = [];
    let lastUpdateTime = 0;
    
    const GRAVITY = 0.2;
    const JUMP = -4.2;
    const PIPE_W = 50;
    const PIPE_GAP = 110;
    const PIPE_SPACING = 220;
    const CANVAS_W = 800;
    const CANVAS_H = 350;
    
    let canvases = { ceylan: null, hakki: null };
    let ctxs = { ceylan: null, hakki: null };
    
    // Rastgele boru üretimi (senkronize)
    let seed = 12345;
    function seededRandom() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    }
    
    function resetPipes() {
        pipes = [];
        seed = 12345;
        for(let i = 0; i < 4; i++) {
            let pipeX = 500 + i * PIPE_SPACING;
            let pipeY = seededRandom() * (CANVAS_H - PIPE_GAP - 80) + 40;
            pipes.push({ x: pipeX, y: pipeY, counted: false });
        }
    }
    
    function initCanvases() {
        canvases.ceylan = document.getElementById('ceylanCanvas');
        canvases.hakki = document.getElementById('hakkiCanvas');
        canvases.ceylan.width = CANVAS_W;
        canvases.ceylan.height = CANVAS_H;
        canvases.hakki.width = CANVAS_W;
        canvases.hakki.height = CANVAS_H;
        ctxs.ceylan = canvases.ceylan.getContext('2d');
        ctxs.hakki = canvases.hakki.getContext('2d');
    }
    
    function updateGame() {
        if (!gameActive) return;
        
        // Sadece kendi kuşun yaşıyorsa güncelle
        if (myBird.alive) {
            myBird.velocity += GRAVITY;
            myBird.y += myBird.velocity;
            
            // Tavan/ taban çarpışması
            if (myBird.y <= 0) { 
                myBird.y = 0; 
                myBird.velocity = 0; 
            }
            if (myBird.y + 24 >= CANVAS_H) {
                die();
            }
        }
        
        // Boruları güncelle (her zaman)
        for(let i = 0; i < pipes.length; i++) {
            let p = pipes[i];
            p.x -= 2.5; // Daha akıcı hareket
            
            if (p.x + PIPE_W < 0) {
                pipes.splice(i, 1);
                let newX = pipes[pipes.length-1].x + PIPE_SPACING;
                let newY = seededRandom() * (CANVAS_H - PIPE_GAP - 80) + 40;
                pipes.push({ x: newX, y: newY, counted: false });
                i--;
                continue;
            }
            
            // Çarpışma kontrolü (sadece canlıysa)
            if (myBird.alive && p.x < 40+15 && p.x+PIPE_W > 40) {
                if (myBird.y < p.y || myBird.y+24 > p.y+PIPE_GAP) {
                    die();
                }
            }
            
            // Skor artırma
            if (myBird.alive && !p.counted && p.x+PIPE_W < 40) {
                p.counted = true;
                myBird.score++;
                updateScoreUI();
                // Sunucuya skoru gönder
                socket.emit('positionUpdate', {
                    room: roomId,
                    character: myCharacter,
                    y: myBird.y,
                    velocity: myBird.velocity,
                    score: myBird.score,
                    deaths: myBird.deaths,
                    alive: myBird.alive
                });
            }
        }
        
        // Pozisyonu sunucuya gönder (her frame'de)
        if (gameActive) {
            socket.emit('positionUpdate', {
                room: roomId,
                character: myCharacter,
                y: myBird.y,
                velocity: myBird.velocity,
                score: myBird.score,
                deaths: myBird.deaths,
                alive: myBird.alive
            });
        }
    }
    
    function die() {
        if (!myBird.alive) return;
        myBird.alive = false;
        myBird.deaths++;
        updateScoreUI();
        
        // Ölümü sunucuya bildir
        socket.emit('positionUpdate', {
            room: roomId,
            character: myCharacter,
            y: myBird.y,
            velocity: myBird.velocity,
            score: myBird.score,
            deaths: myBird.deaths,
            alive: false
        });
        
        // 1 saniye sonra canlan
        setTimeout(() => {
            if (gameActive) {
                myBird.alive = true;
                myBird.y = 160;
                myBird.velocity = 0;
                socket.emit('positionUpdate', {
                    room: roomId, character: myCharacter,
                    y: myBird.y, velocity: myBird.velocity,
                    score: myBird.score, deaths: myBird.deaths, alive: true
                });
            }
        }, 1000);
    }
    
    function updateScoreUI() {
        document.getElementById(`${myCharacter}Score`).innerText = myBird.score;
        document.getElementById(`${myCharacter}Deaths`).innerText = myBird.deaths;
    }
    
    function updateOpponentUI() {
        if (opponentChar) {
            document.getElementById(`${opponentChar}Score`).innerText = opponentBird.score;
            document.getElementById(`${opponentChar}Deaths`).innerText = opponentBird.deaths;
        }
    }
    
    function draw() {
        if (!ctxs.ceylan || !ctxs.hakki) return;
        
        // Ceylan canvas'ı çiz
        drawCanvas('ceylan', myCharacter === 'ceylan' ? myBird : opponentBird, myCharacter === 'ceylan' ? myCharacter : opponentChar);
        // Hakki canvas'ı çiz
        drawCanvas('hakki', myCharacter === 'hakki' ? myBird : opponentBird, myCharacter === 'hakki' ? myCharacter : opponentChar);
        
        drawLoopId = requestAnimationFrame(draw);
    }
    
    function drawCanvas(area, bird, birdChar) {
        let ctx = ctxs[area];
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Gökyüzü efekti
        let grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        grad.addColorStop(0, '#1e6b8f');
        grad.addColorStop(1, '#1e3c4a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Borular
        for(let p of pipes) {
            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(p.x, 0, PIPE_W, p.y);
            ctx.fillRect(p.x, p.y+PIPE_GAP, PIPE_W, CANVAS_H-p.y-PIPE_GAP);
            // Boru başlıkları
            ctx.fillStyle = '#40916c';
            ctx.fillRect(p.x-5, p.y-25, PIPE_W+10, 25);
            ctx.fillRect(p.x-5, p.y+PIPE_GAP, PIPE_W+10, 25);
        }
        
        // Kuş
        if (bird.alive) {
            ctx.fillStyle = birdChar === 'ceylan' ? '#f4a261' : '#e76f51';
            ctx.beginPath();
            ctx.arc(40, bird.y+12, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#2d1b00';
            ctx.beginPath();
            ctx.arc(46, bird.y+7, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(44, bird.y+5, 1.5, 0, Math.PI*2);
            ctx.fill();
            // Gaga
            ctx.fillStyle = '#e8a735';
            ctx.beginPath();
            ctx.moveTo(52, bird.y+9);
            ctx.lineTo(62, bird.y+12);
            ctx.lineTo(52, bird.y+15);
            ctx.fill();
        } else {
            ctx.fillStyle = 'rgba(80,80,80,0.8)';
            ctx.beginPath();
            ctx.arc(40, bird.y+12, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px monospace';
            ctx.fillText("💀", 35, bird.y+18);
        }
        
        // Skor
        ctx.fillStyle = 'white';
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'black';
        ctx.font = 'bold 28px "Press Start 2P", monospace';
        ctx.fillText(bird.score, 30, 55);
        ctx.shadowBlur = 0;
        
        // Ölüm sayısı
        ctx.font = '14px monospace';
        ctx.fillStyle = '#ffaaaa';
        ctx.fillText(`Ölüm: ${bird.deaths}`, CANVAS_W-70, 30);
    }
    
    function jump() {
        if (gameActive && myBird.alive) {
            myBird.velocity = JUMP;
        }
    }
    
    function setupControls() {
        const handleJump = (e) => {
            e.preventDefault();
            jump();
        };
        
        if (canvases.ceylan) canvases.ceylan.addEventListener('click', handleJump);
        if (canvases.hakki) canvases.hakki.addEventListener('click', handleJump);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        
        // Touch için
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
    }
    
    // GAME LOOP (update ve draw ayrı)
    function startGameLoops() {
        if (gameLoopId) clearInterval(gameLoopId);
        gameLoopId = setInterval(() => {
            updateGame();
        }, 1000 / 60); // 60 FPS
        
        if (drawLoopId) cancelAnimationFrame(drawLoopId);
        draw();
    }
    
    function stopGameLoops() {
        if (gameLoopId) clearInterval(gameLoopId);
        if (drawLoopId) cancelAnimationFrame(drawLoopId);
        gameLoopId = null;
        drawLoopId = null;
    }
    
    // ============ SOCKET OLAYLARI ============
    
    document.querySelectorAll('.char-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('confirmCharBtn').disabled = false;
            window.tempChar = card.dataset.char;
        });
    });
    
    document.getElementById('confirmCharBtn').onclick = () => {
        myCharacter = window.tempChar;
        if (!myCharacter) return;
        socket.emit('joinGame');
        document.getElementById('charSelectScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
        document.getElementById('waitStatus').innerHTML = "🕊️ Sunucuya bağlanılıyor...";
    };
    
    socket.on('assignedCharacter', (char) => { 
        myCharacter = char;
        console.log('Karakterin:', char);
    });
    
    socket.on('roomJoined', (room) => { 
        roomId = room;
        console.log('Odaya katıldı:', room);
    });
    
    socket.on('bothPlayersReady', (settings) => {
        document.getElementById('waitingScreen').style.display = 'none';
        if(myCharacter === 'ceylan') {
            document.getElementById('settingsCeylan').style.display = 'flex';
        } else {
            document.getElementById('settingsHakki').style.display = 'flex';
        }
    });
    
    document.getElementById('ceylanReadyBtn').onclick = () => {
        let prize = document.getElementById('ceylanPrize').value || "Sürpriz bir hediye!";
        let lossLimit = parseInt(document.getElementById('ceylanLossLimit').value) || 5;
        socket.emit('updateSettings', { room: roomId, settings: { prize, ceylanLossLimit: lossLimit } });
        socket.emit('playerReady', { room: roomId, character: 'ceylan' });
        document.getElementById('settingsCeylan').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
        document.getElementById('waitStatus').innerHTML = "💕 Hakkı'nın hazır olmasını bekliyorum...";
    };
    
    document.getElementById('hakkiReadyBtn').onclick = () => {
        let prize = document.getElementById('hakkiPrize').value || "Sonsuz sevgi!";
        let mode = document.getElementById('gameMode').value;
        let lossLimit = parseInt(document.getElementById('hakkiLossLimit').value) || 5;
        socket.emit('updateSettings', { room: roomId, settings: { prize, hakkiMode: mode, hakkiLossLimit: lossLimit } });
        socket.emit('playerReady', { room: roomId, character: 'hakki' });
        document.getElementById('settingsHakki').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
        document.getElementById('waitStatus').innerHTML = "💕 Ceylan'ın hazır olmasını bekliyorum...";
    };
    
    socket.on('gameStart', (data) => {
        console.log('Oyun başlıyor!', data);
        gameActive = true;
        myBird = { y: 160, velocity: 0, alive: true, score: 0, deaths: 0 };
        opponentBird = { y: 160, velocity: 0, alive: true, score: 0, deaths: 0 };
        opponentChar = (myCharacter === 'ceylan') ? 'hakki' : 'ceylan';
        
        document.getElementById('waitingScreen').style.display = 'none';
        document.getElementById('gameUI').style.display = 'block';
        
        initCanvases();
        resetPipes();
        setupControls();
        startGameLoops();
        
        // Başlangıç pozisyonunu gönder
        setTimeout(() => {
            socket.emit('positionUpdate', {
                room: roomId, character: myCharacter,
                y: myBird.y, velocity: myBird.velocity,
                score: 0, deaths: 0, alive: true
            });
        }, 100);
    });
    
    socket.on('opponentPosition', (data) => {
        if (!gameActive) return;
        opponentBird.y = data.y;
        opponentBird.velocity = data.velocity;
        opponentBird.score = data.score;
        opponentBird.deaths = data.deaths;
        opponentBird.alive = data.alive;
        updateOpponentUI();
    });
    
    socket.on('gameOver', (data) => {
        gameActive = false;
        stopGameLoops();
        document.getElementById('winnerText').innerHTML = data.winner === 'ceylan' ? '🎉 CEYLAN KAZANDI 🎉' : '🔥 HAKKI KAZANDI 🔥';
        document.getElementById('prizeText').innerHTML = `🎁 ÖDÜL: ${data.prize || 'Sonsuz sevgi ❤️'}`;
        document.getElementById('gameOverModal').style.display = 'flex';
    });
    
    socket.on('opponentDisconnected', () => {
        stopGameLoops();
        alert('💔 Rakip bağlantısı koptu! Sayfa yenilenecek.');
        location.reload();
    });
    
    socket.on('settingsUpdated', (settings) => {
        console.log('Rakip ayarları güncelledi:', settings);
    });
</script>
</body>
</html>
