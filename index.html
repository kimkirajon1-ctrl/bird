<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Aşk - Ceylan & Hakkı</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0a1a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        /* Ana container */
        .game-container {
            width: 1300px;
            max-width: 98vw;
            background: #000000aa;
            border-radius: 48px;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            padding: 20px;
        }
        /* Ekranlar (yatay bölünmüş) */
        .split-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .player-area {
            background: rgba(0,0,0,0.6);
            border-radius: 32px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,215,0,0.3);
            transition: all 0.2s;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            color: gold;
            font-weight: bold;
            font-size: 1.5rem;
            border-bottom: 1px solid gold;
        }
        .score-board {
            display: flex;
            gap: 24px;
            font-family: monospace;
            font-size: 1.2rem;
        }
        canvas {
            display: block;
            width: 100%;
            background: #1e3c4a;
            cursor: pointer;
        }
        /* Modal / ekran geçişleri */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0f172a, #020617);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.4s;
            backdrop-filter: blur(12px);
        }
        .card {
            background: rgba(30,41,59,0.9);
            backdrop-filter: blur(20px);
            border-radius: 64px;
            padding: 40px;
            width: 500px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .char-select {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 30px 0;
        }
        .char-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            border: 3px solid transparent;
        }
        .char-card.selected {
            border-color: gold;
            background: #2d3a5e;
            transform: scale(1.02);
        }
        button {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.96);}
        input, select {
            padding: 12px;
            margin: 10px 0;
            border-radius: 60px;
            border: none;
            width: 80%;
            font-size: 1rem;
            text-align: center;
        }
        .prize-area {
            background: #00000055;
            border-radius: 48px;
            padding: 20px;
            margin: 20px 0;
        }
        .status-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: black;
            padding: 8px 16px;
            border-radius: 30px;
            color: lime;
            font-family: monospace;
            z-index: 2000;
        }
        @media (max-width: 800px) {
            .player-header { font-size: 1rem; }
            .score-board { font-size: 0.8rem; gap: 12px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="game-container" style="display: none;" id="gameUI">
        <div class="split-screen">
            <!-- CEYLAN (Üst) -->
            <div class="player-area" id="ceylanArea">
                <div class="player-header">
                    <span>🦢 CEYLAN 💖</span>
                    <div class="score-board">
                        <span>🏆 Skor: <span id="ceylanScore">0</span></span>
                        <span>💀 Ölüm: <span id="ceylanDeaths">0</span></span>
                    </div>
                </div>
                <canvas id="ceylanCanvas" width="800" height="350" style="width:100%; height:auto; background:#1e3c4a"></canvas>
            </div>
            <!-- HAKKI (Alt) -->
            <div class="player-area" id="hakkiArea">
                <div class="player-header">
                    <span>🦅 HAKKI 🔥</span>
                    <div class="score-board">
                        <span>🏆 Skor: <span id="hakkiScore">0</span></span>
                        <span>💀 Ölüm: <span id="hakkiDeaths">0</span></span>
                    </div>
                </div>
                <canvas id="hakkiCanvas" width="800" height="350" style="width:100%; height:auto; background:#1e3c4a"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- KARAKTER SEÇİM EKRANI -->
<div id="charSelectScreen" class="screen">
    <div class="card">
        <h1 style="color:#FFD966">✨ AŞKIN KANATLARI ✨</h1>
        <h3>Karakterini seç, aşk kuşu</h3>
        <div class="char-select">
            <div class="char-card" data-char="ceylan">
                <div style="font-size: 80px;">🦢</div>
                <div>Ceylan</div>
            </div>
            <div class="char-card" data-char="hakki">
                <div style="font-size: 80px;">🦅</div>
                <div>Hakkı</div>
            </div>
        </div>
        <button id="confirmCharBtn" disabled>Seçimi Onayla</button>
    </div>
</div>

<!-- AYAR EKRANI (CEYLAN) -->
<div id="settingsCeylan" class="screen" style="display: none;">
    <div class="card">
        <h2>🎁 Ceylan Ödül Belirleme 🎁</h2>
        <div class="prize-area">
            <label>Kazananın kaybedenden alacağı ödül:</label>
            <input type="text" id="ceylanPrize" placeholder="Örn: Sana kahve ısmarlayacaksın ❤️">
            <label>Kaybetme sınırı (kaç kez ölünce kaybeder):</label>
            <input type="number" id="ceylanLossLimit" value="5" min="1" max="20">
        </div>
        <button id="ceylanReadyBtn">⚡ Oyuna Hazırım ⚡</button>
    </div>
</div>

<!-- AYAR EKRANI (HAKKI) -->
<div id="settingsHakki" class="screen" style="display: none;">
    <div class="card">
        <h2>🔥 Hakkı Ayarları 🔥</h2>
        <div class="prize-area">
            <label>Kazananın kaybedenden alacağı ödül:</label>
            <input type="text" id="hakkiPrize" placeholder="Sarılmak, kahve vs.">
            <label>Oyun Modu:</label>
            <select id="gameMode">
                <option value="normal">Normal Mod (İlk hedefe ulaşan kaybeder)</option>
                <option value="ask">💖 AŞK MODU 💖 - Ceylan hep kazanır!</option>
            </select>
            <label>Kaybetme sınırı (Hakkı için):</label>
            <input type="number" id="hakkiLossLimit" value="5" min="1" max="20">
        </div>
        <button id="hakkiReadyBtn">💘 Oyuna Hazırım 💘</button>
    </div>
</div>

<div id="waitingScreen" class="screen" style="display: none;">
    <div class="card">
        <h2>🌈 Rakipler birleşiyor... 🌈</h2>
        <div style="font-size: 40px;">⏳</div>
        <p>Karşındaki oyuncunun hazır olmasını bekliyorum...</p>
        <div id="waitStatus">✨ Bekleniyor ✨</div>
    </div>
</div>

<div id="gameOverModal" class="screen" style="display: none;">
    <div class="card">
        <h1 id="winnerText">🎉 KAZANAN 🎉</h1>
        <p id="prizeText" style="font-size: 1.5rem; margin: 20px;"></p>
        <button onclick="location.reload()">🔄 Yeniden Oyna</button>
    </div>
</div>

<script>
    // GLOBAL
    let socket = io();
    let myCharacter = null;
    let roomId = null;
    let gameSettings = null;
    let gameActive = false;
    let rafId = null;
    let playersReadyState = { ceylan: false, hakki: false };
    
    // Oyun durumları (her canvas için ayrı)
    let games = {
        ceylan: { birdY: 160, velocity: 0, score: 0, deaths: 0, pipes: [], frame: 0, gameOver: true, canvas: null, ctx: null, lastTimestamp: 0 },
        hakki: { birdY: 160, velocity: 0, score: 0, deaths: 0, pipes: [], frame: 0, gameOver: true, canvas: null, ctx: null, lastTimestamp: 0 }
    };
    
    const GRAVITY = 0.2;
    const JUMP = -4.2;
    const PIPE_W = 50;
    const PIPE_GAP = 110;
    const PIPE_SPACING = 220;
    
    function initCanvas(char) {
        let canvas = document.getElementById(`${char}Canvas`);
        if (!canvas) return;
        let ctx = canvas.getContext('2d');
        games[char].canvas = canvas;
        games[char].ctx = ctx;
        canvas.width = 800;
        canvas.height = 350;
        resetGameLocal(char);
        // click olayı
        canvas.addEventListener('click', () => {
            if (gameActive && !games[char].gameOver && myCharacter === char) {
                games[char].velocity = JUMP;
            }
        });
    }
    
    function resetGameLocal(char) {
        let g = games[char];
        g.birdY = 160;
        g.velocity = 0;
        g.score = 0;
        if (!g.gameOver) g.deaths = 0; // ölüm sayısını sıfırlama sadece yeni oyunda server setler
        g.pipes = [];
        g.frame = 0;
        g.gameOver = false;
        for(let i = 0; i < 3; i++) {
            let pipeX = 500 + i * PIPE_SPACING;
            let pipeY = Math.random() * (g.canvas.height - PIPE_GAP - 80) + 40;
            g.pipes.push({ x: pipeX, y: pipeY, counted: false });
        }
    }
    
    function updateGame(char) {
        let g = games[char];
        if (!g.canvas || g.gameOver || !gameActive) return false;
        // fizik
        g.velocity += GRAVITY;
        g.birdY += g.velocity;
        if (g.birdY <= 0) { g.birdY = 0; g.velocity = 0; }
        if (g.birdY + 24 >= g.canvas.height) { die(char); return false; }
        
        // borular
        for (let i=0; i<g.pipes.length; i++) {
            let p = g.pipes[i];
            p.x -= 2;
            if (p.x + PIPE_W < 0) {
                g.pipes.splice(i,1);
                let newX = g.pipes[g.pipes.length-1].x + PIPE_SPACING;
                let newY = Math.random() * (g.canvas.height - PIPE_GAP - 80) + 40;
                g.pipes.push({ x: newX, y: newY, counted: false });
                i--;
                continue;
            }
            // collision
            if (p.x < 40+15 && p.x+PIPE_W > 40) {
                if (g.birdY < p.y || g.birdY+24 > p.y+PIPE_GAP) { die(char); return false; }
            }
            if (!p.counted && p.x+PIPE_W < 40) {
                p.counted = true;
                g.score++;
                socket.emit('scoreUpdate', { room: roomId, character: char, score: g.score, deathCount: g.deaths });
            }
        }
        g.frame++;
        return true;
    }
    
    function die(char) {
        if (!gameActive) return;
        let g = games[char];
        if (g.gameOver) return;
        g.gameOver = true;
        g.deaths++;
        // sunucuya ölüm bildir
        socket.emit('scoreUpdate', { room: roomId, character: char, score: g.score, deathCount: g.deaths });
        // 1 saniye sonra canlan
        setTimeout(() => {
            if (gameActive && !games[char].gameOver === false) resetGameLocal(char);
            else if(gameActive) resetGameLocal(char);
        }, 800);
    }
    
    function drawAll() {
        for(let char of ['ceylan','hakki']) {
            let g = games[char];
            if (!g.ctx) continue;
            let ctx = g.ctx;
            ctx.clearRect(0,0,g.canvas.width,g.canvas.height);
            ctx.fillStyle = '#1e3c4a';
            ctx.fillRect(0,0,g.canvas.width,g.canvas.height);
            // borular
            ctx.fillStyle = '#2d6a4f';
            for(let p of g.pipes) {
                ctx.fillRect(p.x, 0, PIPE_W, p.y);
                ctx.fillRect(p.x, p.y+PIPE_GAP, PIPE_W, g.canvas.height-p.y-PIPE_GAP);
                ctx.fillStyle = '#40916c';
                ctx.fillRect(p.x-5, p.y-20, PIPE_W+10, 20);
                ctx.fillRect(p.x-5, p.y+PIPE_GAP, PIPE_W+10, 20);
                ctx.fillStyle = '#2d6a4f';
            }
            // kuş
            ctx.fillStyle = char === 'ceylan' ? '#f4a261' : '#e76f51';
            ctx.beginPath();
            ctx.arc(40, g.birdY+12, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(46, g.birdY+7, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(g.score, 30, 40);
            if(g.gameOver) {
                ctx.fillStyle = 'red';
                ctx.font = 'bold 18px monospace';
                ctx.fillText("ÖLÜM", 30, 80);
            }
        }
        requestAnimationFrame(() => { if(gameActive) drawAll(); });
    }
    
    function animateGame() {
        if(!gameActive) return;
        for(let char of ['ceylan','hakki']) {
            updateGame(char);
        }
        drawAll();
        setTimeout(() => animateGame(), 20);
    }
    
    // UI ve socket olayları
    document.querySelectorAll('.char-card').forEach(card => {
        card.addEventListener('click', (e) => {
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('confirmCharBtn').disabled = false;
            window.tempChar = card.dataset.char;
        });
    });
    document.getElementById('confirmCharBtn').onclick = () => {
        myCharacter = window.tempChar;
        if(!myCharacter) return;
        socket.emit('joinGame');
        document.getElementById('charSelectScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
    };
    
    socket.on('assignedCharacter', (char) => { myCharacter = char; });
    socket.on('roomJoined', (room) => { roomId = room; });
    socket.on('bothPlayersReady', (settings) => {
        document.getElementById('waitingScreen').style.display = 'none';
        if(myCharacter === 'ceylan') document.getElementById('settingsCeylan').style.display = 'flex';
        else document.getElementById('settingsHakki').style.display = 'flex';
    });
    document.getElementById('ceylanReadyBtn').onclick = () => {
        let prize = document.getElementById('ceylanPrize').value;
        let lossLimit = parseInt(document.getElementById('ceylanLossLimit').value);
        socket.emit('updateSettings', { room: roomId, settings: { prize: prize, ceylanLossLimit: lossLimit } });
        socket.emit('playerReady', { room: roomId, character: 'ceylan' });
        document.getElementById('settingsCeylan').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
        document.getElementById('waitStatus').innerText = "Rakip hazır olunca başlıyor...";
    };
    document.getElementById('hakkiReadyBtn').onclick = () => {
        let prize = document.getElementById('hakkiPrize').value;
        let mode = document.getElementById('gameMode').value;
        let lossLimit = parseInt(document.getElementById('hakkiLossLimit').value);
        socket.emit('updateSettings', { room: roomId, settings: { prize: prize, hakkiMode: mode, hakkiLossLimit: lossLimit } });
        socket.emit('playerReady', { room: roomId, character: 'hakki' });
        document.getElementById('settingsHakki').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'flex';
        document.getElementById('waitStatus').innerText = "Ceylan hazır olunca başlıyor...";
    };
    socket.on('gameStart', (data) => {
        gameActive = true;
        document.getElementById('waitingScreen').style.display = 'none';
        document.getElementById('gameUI').style.display = 'block';
        gameSettings = data.settings;
        for(let char of ['ceylan','hakki']) {
            initCanvas(char);
            games[char].deaths = data.deaths[char];
            document.getElementById(`${char}Deaths`).innerText = games[char].deaths;
            resetGameLocal(char);
        }
        animateGame();
    });
    socket.on('stateUpdate', (state) => {
        document.getElementById('ceylanScore').innerText = state.scores.ceylan;
        document.getElementById('hakkiScore').innerText = state.scores.hakki;
        document.getElementById('ceylanDeaths').innerText = state.deaths.ceylan;
        document.getElementById('hakkiDeaths').innerText = state.deaths.hakki;
        games.ceylan.deaths = state.deaths.ceylan;
        games.hakki.deaths = state.deaths.hakki;
    });
    socket.on('gameOver', (data) => {
        gameActive = false;
        document.getElementById('winnerText').innerHTML = data.winner === 'ceylan' ? '🎉 CEYLAN KAZANDI 🎉' : '🔥 HAKKI KAZANDI 🔥';
        document.getElementById('prizeText').innerHTML = `🎁 ÖDÜL: ${data.prize || 'Sonsuz sevgi ❤️'}`;
        document.getElementById('gameOverModal').style.display = 'flex';
    });
    socket.on('opponentDisconnected', () => {
        alert('Rakip bağlantısı koptu, sayfayı yenile.');
        location.reload();
    });
</script>
</body>
</html>
